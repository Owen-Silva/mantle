<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file:; script-src file:; img-src file: data:; font-src file:">
<title>Mantle Recording</title>
<!-- Screen recording (lib/features/screenrec.js, lane screenrec2): the Stop pill while it records, top
     centre, with a calm living timer; when the file is done the pill grows into the end card in place:
     Open, Copy (the file, to paste into Discord or a chat), Show in folder. Plain words if it failed.
     The window is content-protected (never in a recording) and see-through outside the shape, where
     every click goes through to what is under it. -->
<link rel="stylesheet" href="../shared/glass-light.css">
<link rel="stylesheet" href="screenrec.css">
</head>
<body>
<div id="stage">
  <div id="shape" class="enter" hidden>
    <div id="pill" class="face" role="group" aria-label="Recording">
      <span class="dot" aria-hidden="true"></span>
      <span id="clock" class="clock" role="timer" aria-live="off">0:00</span>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="stop" class="stop" title="Stop recording (Win+Shift+S)">
        <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.8" fill="currentColor"/></svg>
        <span>Stop</span>
      </button>
    </div>
    <div id="card" class="face" hidden>
      <div id="glyph" class="glyph" aria-hidden="true">
        <svg class="ok" viewBox="0 0 20 20"><path d="M7.6 5.9v8.2a.6.6 0 0 0 .9.5l6.3-4.1a.6.6 0 0 0 0-1l-6.3-4.1a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg>
        <svg class="bad" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2l6.2 10.9H1.8z"/><path d="M8 6.4v3M8 11.2v.01"/></svg>
      </div>
      <div class="text">
        <div id="title" class="title" role="status"></div>
        <div id="detail" class="detail"></div>
        <div id="name" class="name"></div>
        <div id="note" class="note" hidden></div>
        <div class="actions" id="actions">
          <button type="button" id="open" class="act primary" title="Open the recording">Open</button>
          <button type="button" id="copy" class="act" title="Copy the video file, to paste into Discord or a chat">Copy</button>
          <button type="button" id="folder" class="act" title="Show the recording in its folder">Show in folder</button>
        </div>
        <div id="status" class="status" aria-live="polite"></div>
      </div>
      <button type="button" id="close" class="x" title="Close" aria-label="Close">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>
<script src="mock-screenrec.js"></script>
<script src="screenrec.js"></script>
</body>
</html>
