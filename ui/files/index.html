<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src file:; style-src file:; img-src file: data:; media-src file:; frame-src file: chrome-extension:; object-src file:; font-src file:">
<title>Mantle Files</title>
<!-- glass-light.css ONLY: the taskbar island's --lg-* tokens are the whole palette -->
<link rel="stylesheet" href="../shared/glass-light.css">
<link rel="stylesheet" href="files.css">
<link rel="stylesheet" href="../shared/wall-bdrop.css">
</head>
<body>
<!-- Mantle Files (lib/features/files.js): the File Explorer replacement. The page never touches the
     disk: every read and write is a window.mantle.call('files.<verb>') to main, which asks the sidecar.
     model.js = pure rules, list.js = the virtualised file list, panes.js = menus, dialogs, toasts,
     progress, preview and properties, files.js = the window (tabs, nav pane, address bar, commands). -->
<div class="app" id="app">
  <header class="titlebar" id="titlebar">
    <div class="tabs" id="tabs" role="tablist" aria-label="Tabs"></div>
    <button class="newtab" id="newtab" type="button" title="New tab (Ctrl+T)" aria-label="New tab"></button>
    <div class="grow"></div>
    <span class="chip" id="testchip" hidden title="Main runs in --test: writes are refused outside the sandbox and apps never open">test mode</span>
    <div class="wc">
      <button data-op="min" type="button" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M1 5h8" stroke="currentColor" stroke-width="1.1"/></svg></button>
      <button data-op="max" type="button" title="Maximize" aria-label="Maximize"><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.1" fill="none"/></svg></button>
      <button data-op="close" class="x" type="button" title="Close window" aria-label="Close window"><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.1"/></svg></button>
    </div>
  </header>

  <div class="navbar">
    <button class="ib" id="back" type="button" title="Back (Alt+Left)" aria-label="Back"></button>
    <button class="ib" id="fwd" type="button" title="Forward (Alt+Right)" aria-label="Forward"></button>
    <button class="ib" id="up" type="button" title="Up (Alt+Up)" aria-label="Up one level"></button>
    <button class="ib" id="refresh" type="button" title="Refresh (F5)" aria-label="Refresh"></button>
    <div class="address" id="address" title="Click to type a path (Ctrl+L)">
      <div class="crumbs" id="crumbs"></div>
      <input id="addrinput" type="text" spellcheck="false" autocomplete="off" aria-label="Address" hidden>
    </div>
    <div class="search" id="searchbox">
      <span class="sicon" id="sicon"></span>
      <input id="search" type="text" spellcheck="false" autocomplete="off" placeholder="Search" aria-label="Search this folder (Ctrl+F)">
      <button class="sclear" id="searchclear" type="button" title="Clear the search (Esc)" aria-label="Clear the search" hidden></button>
    </div>
  </div>

  <div class="cmdbar" id="cmdbar" role="toolbar" aria-label="Commands"></div>

  <div class="body">
    <nav class="navpane" id="navpane" aria-label="Places"></nav>
    <main class="main" id="main">
      <div class="banner" id="banner" hidden></div>
      <div class="fbar" id="fbar" hidden></div>
      <div class="colhead" id="colhead" hidden></div>
      <div class="scroller" id="scroller" tabindex="0" aria-label="Files">
        <div class="spacer" id="spacer"></div>
        <div class="layer" id="layer"></div>
        <div class="band" id="band" hidden></div>
      </div>
      <div class="place" id="place" hidden></div>
      <div class="empty" id="empty" hidden></div>
    </main>
    <aside class="side" id="side" hidden></aside>
  </div>

  <footer class="status" id="status">
    <span id="stcount"></span>
    <span id="stsel"></span>
    <span class="grow"></span>
    <span id="stnote" class="stnote"></span>
    <span id="stwall" class="stnote" hidden></span>
    <span id="stload" class="stload" hidden></span>
    <span class="views">
      <button class="ib sm" id="vdetails" type="button" title="Details (Ctrl+Shift+6)" aria-label="Details view"></button>
      <button class="ib sm" id="vgrid" type="button" title="Icons (Ctrl+Shift+3)" aria-label="Icons view"></button>
    </span>
  </footer>
</div>
<div class="menus" id="menus"></div>
<div class="progress" id="progress"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal" id="modal" hidden></div>
<script src="../../lib/plain-error.js"></script>
<script src="model.js"></script>
<script src="mock-mantle.js"></script>
<!-- dark: the wallpaper under the tint, as Helm does (lane helm-wall-apps) -->
<script src="../shared/wall-bdrop.js" data-event="files.wall" data-pos="files.wallpos"></script>
<script src="list.js"></script>
<script src="panes.js"></script>
<script src="files.js"></script>
</body>
</html>
