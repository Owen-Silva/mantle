<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<!-- file:// documents are opaque origins, so 'self' would match nothing here; scheme
     sources are what Electron accepts without logging its insecure-CSP warning. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file: 'unsafe-inline'; script-src file:; img-src file: data:">
<title>Mantle bar</title>
<!-- tokens.css FIRST: Mantle's dark instrument palette, which the launcher and the desktop layer
     still resolve through. glass-light.css comes after it and carries the Northwind nav pill's LIGHT
     frosted glass as --lg-*, which is what the bar is built from (Owen, 2026-09-21). bar.css may
     use nothing but var(--lg-…) for colour, never a literal. -->
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/glass-light.css">
<link rel="stylesheet" href="bar.css">
<link rel="stylesheet" href="notifications.css">
<link rel="stylesheet" href="qs-more.css">
</head>
<!-- data-edge says which screen edge the bar is docked to. bar.js overwrites it from State.edge.
     class="pre edge": the flush, fully transparent state with NO transition, which is how the
     page must paint before main's first 'bar.reveal' arrives; `edge` is the safe default shape
     until that event says whether main is holding the window as a pill. bar.js drops .pre on the
     first event and adds `up`. -->
<body data-edge="bottom" class="pre edge no-backdrop">

<div id="bar" class="bar" role="toolbar" aria-label="Mantle bar">

  <!-- THE BACKDROP, and it must be the FIRST child so it paints under everything. Main sends a
       PNG of the screen strip behind the bar ~4x a second while the bar is up; bar.js swaps the
       src and nothing else, and bar.css blurs it and clips it to the bar's radius. This is the
       whole reason the glass is see-through: no DWM mode could be tuned to do it. -->
  <div class="bdrop" aria-hidden="true"><img id="backdrop" alt=""></div>

  <!-- LEFT: the Mantle mark, which opens the launcher. Inline SVG so it inherits currentColor
       and needs no asset (img-src would have to allow it, and a missing file would be a hole). -->
  <div class="left">
    <button id="start" class="btn start" type="button" title="Open the Mantle launcher" aria-label="Open the Mantle launcher">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <!-- one path, fill-rule evenodd: the M is a hole CUT out of the rounded square -->
        <path fill="currentColor" fill-rule="evenodd" d="M7.2 3h9.6A4.2 4.2 0 0 1 21 7.2v9.6a4.2 4.2 0 0 1-4.2 4.2H7.2A4.2 4.2 0 0 1 3 16.8V7.2A4.2 4.2 0 0 1 7.2 3Zm1.05 4.6a.6.6 0 0 0-.6.6v7.6a.6.6 0 0 0 .6.6h1.3a.6.6 0 0 0 .6-.6v-3.63l1.33 2.06a.6.6 0 0 0 1.01 0l1.33-2.06v3.63a.6.6 0 0 0 .6.6h1.3a.6.6 0 0 0 .6-.6V8.2a.6.6 0 0 0-.6-.6h-1.2a.6.6 0 0 0-.51.29L12 11.3 9.96 7.89a.6.6 0 0 0-.51-.29h-1.2Z"/>
      </svg>
    </button>
  </div>

  <!-- CENTRE: pinned apps, then a hairline, then apps that are only running. Absolutely centred
       on the window by bar.css, so the row never shifts when the right cluster changes width.
       bar.js diffs this list by item id, so cells are reused and icons never flicker. -->
  <div id="dock" class="dock" role="group" aria-label="Pinned and running apps"></div>

  <!-- RIGHT: the regular stuff — state strip, tray, instruments, clock, overflow menu. -->
  <div class="right">
    <div id="chips" class="chips" role="status" aria-live="polite"></div>
    <!-- NOW PLAYING: hidden while no app has a media session. The art and title open the media
         card; the glyph is play/pause for the session shown, and is absent (not greyed) for an
         LessonPlayer lesson under the LessonPlayer rule. bar.js fills both from main's 'media' push. -->
    <div id="media" class="media" role="group" aria-label="Now playing" hidden>
      <button id="mchip" class="btn mchip" type="button"><span class="mart" aria-hidden="true"></span><span class="mtxt"></span></button>
      <button id="mtog" class="btn mtog" type="button"></button>
    </div>
    <div id="tray" class="tray" role="group" aria-label="Notification area"></div>
    <div class="sep" aria-hidden="true"></div>

    <button id="volume" class="btn glyph" type="button" title="Volume"></button>
    <button id="network" class="btn glyph" type="button" title="Network, sound and battery — Windows quick settings">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M1.6 5.6a9.5 9.5 0 0 1 12.8 0"/>
          <path d="M4 8.2a6 6 0 0 1 8 0"/>
          <path d="M6.3 10.8a2.6 2.6 0 0 1 3.4 0"/>
        </g>
        <circle cx="8" cy="13.2" r="1" fill="currentColor"/>
      </svg>
    </button>
    <button id="battery" class="btn glyph battery" type="button" title="Battery" hidden></button>

    <!-- time over date, like the Windows 11 clock; clicking it opens the notification centre -->
    <button id="clock" class="btn clock" type="button" title="Notifications and calendar">
      <span class="t">--:--</span><span class="d">--</span>
    </button>

    <!-- Mantle's notification centre (ui/bar/notifications.js), where Windows 11 keeps its bell:
         right of the clock, with the count of what arrived since the panel was last opened. -->
    <button id="notifs" class="btn glyph notifs" type="button" title="Notifications" aria-label="Notifications">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <path fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"
              d="M8 2.2a3.9 3.9 0 0 0-3.9 3.9v2.6L2.9 11h10.2l-1.2-2.3V6.1A3.9 3.9 0 0 0 8 2.2Z"/>
        <path fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" d="M6.4 12.9a1.7 1.7 0 0 0 3.2 0"/>
      </svg>
      <span class="nbadge" hidden></span>
    </button>

    <button id="more" class="btn glyph more" type="button" title="More" aria-label="More">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <g fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></g>
      </svg>
    </button>
  </div>

  <!-- Single popover host: only one popover is ever open, so one element is reused.
       It lives inside .bar so it is positioned against the bar and flips with data-edge. -->
  <div id="pop" class="pop" hidden></div>
</div>

<!-- mock FIRST so that, outside Electron, window.mantle exists before bar.js looks for it.
     Inside Electron the preload has already installed the real bridge and the mock stands down. -->
<script src="mock-mantle.js"></script>
<!-- the notification centre defines window.MantleNotifs; bar.js hands it the popover helpers -->
<script src="notifications.js"></script>
<!-- quick settings one level down (Wi-Fi list, output picker, mixer) defines window.MantleQsMore -->
<script src="qs-more.js"></script>
<script src="bar.js"></script>
</body>
</html>
