<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<!-- file:// is an opaque origin, so scheme sources; data: is the desktop picture main sends -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file:; script-src file:; img-src file: data: blob:">
<title>Mantle unfold</title>
<link rel="stylesheet" href="../shared/glass-light.css">
<link rel="stylesheet" href="../shared/unfold.css">
<link rel="stylesheet" href="unfold-page.css">
</head>
<body>
<!-- The full-screen unfold (lib/features/unfold.js). Click-through, never focused, excluded from
     capture; nothing here takes input. On top, #gl: the iPhone Duo unfold drawn per pixel in WebGL
     (the shipped technique). Under it, the fallback for a graphics card without WebGL: the
     deep-frosted picture with the tint, the leaf (the opening, holding the sharp picture, its blurred
     copy and its smeared copy), and the two edge lights. -->
<div id="stage" data-pose="parked" aria-hidden="true">
  <canvas id="ground" class="layer"></canvas>
  <div id="tint" class="layer"></div>
  <div id="leaf" class="layer">
    <div id="leaf-in" class="layer">
      <img id="sharp" class="layer" alt="">
      <canvas id="soft" class="layer"></canvas>
      <canvas id="smear" class="layer"></canvas>
    </div>
  </div>
  <div id="sheen-l" class="sheen"></div>
  <div id="sheen-r" class="sheen"></div>
  <canvas id="gl" class="layer"></canvas>
</div>
<script src="../shared/unfold.js"></script>
<script src="unfold-page.js"></script>
</body>
</html>
