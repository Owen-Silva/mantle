<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file:; script-src file:; img-src file: data:; font-src file:">
<!-- The window title is what sidecar/MenuBar.cs checks before it ever removes a stale app bar. -->
<title>Mantle top bar</title>
<link rel="stylesheet" href="../shared/glass-light.css">
<link rel="stylesheet" href="topbar.css">
<link rel="stylesheet" href="pingtest.css">
</head>
<body>
  <!-- The strip itself: the Mantle menu, the focused app's bold name and its menus on the left;
       live system stats on the right (the user, 2026-09-24: "i also want the top bar to show stats
       about my computer like ram cpu gpu etc."). The bottom bar already has Wi-Fi, volume,
       battery, the clock and the bell, so none of those are repeated here. -->
  <!-- DARK ONLY: the desktop's strip under the bar (main sends it, lib/features/_topbar-glass.js);
       #bar blurs it with its backdrop-filter and lays its tint over it. Never shown in light.
       #bglass holds it and, only while the sidecar's own colour layer is up behind the bar (NATIVE,
       lane zero-page), #btint: the tint and its blur move off #bar into #btint so the glass can be
       masked per column (topbar.css) while the words stay whole. -->
  <div id="bglass" aria-hidden="true"><div id="bdrop" aria-hidden="true"></div><div id="btint"></div></div>
  <header id="bar" role="menubar" aria-label="Menu bar">
    <nav id="left"></nav>
    <div id="right"></div>
  </header>
  <!-- open dropdowns (a menu and its submenus), positioned under their titles -->
  <div id="menus"></div>
<script src="mock-mantle.js"></script>
<!-- the timer's time math (lib/features/_timer-core.js, shared with main): window.TimerCore -->
<script src="../../lib/features/_timer-core.js"></script>
<script src="model.js"></script>
<!-- the 1 s stat cells drawn in place (lane mantle-idlefix-stats): window.TopbarStatsView -->
<script src="stats-view.js"></script>
<!-- the glass in dark (lane see-topbar): window.TopbarGlass -->
<script src="../shared/glass-adapt.js"></script>
<script src="glass.js"></script>
<!-- the colour under the bar in dark (lane mantle-topbar-under): window.TopbarUnder -->
<script src="under.js"></script>
<!-- the ping test in the PING dropdown (lane pingtest): window.PingTest -->
<script src="pingtest.js"></script>
<!-- app power in the CPU / RAM / GPU dropdowns (lane mantle-power-ui): window.AppPower -->
<script src="apppower.js"></script>
<script src="topbar.js"></script>
</body>
</html>
