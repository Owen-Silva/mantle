<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file:; script-src file:; img-src file: data:; font-src file:">
<title>Mantle record</title>
<!-- glass-light.css ONLY: the taskbar island's --lg-* tokens are the whole palette -->
<link rel="stylesheet" href="../shared/glass-light.css">
<link rel="stylesheet" href="record.css">
<link rel="stylesheet" href="../shared/hud-backdrop.css">
<!-- lane corner-follow: the card glides above the bar's pill while the bar is up (#lift owns the transform) -->
<link rel="stylesheet" href="../shared/bar-follow.css">
</head>
<body>
<!-- Win+G: Mantle's Record panel (lib/features/clips.js). Bottom right, over the app in front; it never
     takes the foreground (focusable:false), so the app the user is in is the one Windows records, and it is
     excluded from every capture. Windows records (Game Bar's own engine, Win+Alt+R); Mantle watches the
     file. Everything on it comes from main's clips.state; the page keeps only the running clock. -->
<div id="lift">
<section id="card" class="card" role="dialog" aria-label="Record" hidden>
  <header class="top">
    <span class="title">Record</span>
    <span id="app" class="app" title="The window Windows will record"></span>
    <span class="grow"></span>
    <button id="x" class="ib" type="button" aria-label="Close (Esc)" title="Close (Esc)"><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
  </header>

  <div class="main">
    <button id="rec" class="rec" type="button" aria-describedby="status" title="Record (R)">
      <span class="core" aria-hidden="true"></span>
      <span id="recLabel" class="sr">Record</span>
    </button>
    <div class="readout">
      <div id="clock" class="clock" aria-live="off">0:00</div>
      <div id="status" class="status" aria-live="polite"><i id="dot" class="dot" aria-hidden="true"></i><span id="statusText">Ready</span></div>
    </div>
  </div>
  <!-- a game is in front: Mantle never sends keys to it, so the user presses Windows' own chord -->
  <div id="hint" class="hint" hidden>
    <span class="keys" aria-hidden="true"><kbd>Win</kbd><kbd>Alt</kbd><kbd>R</kbd></span>
    <span id="hintText" class="hint-text"></span>
  </div>
  <div id="warn" class="warn" role="status" hidden></div>

  <div class="rows">
    <button id="mic" class="row" type="button" role="switch" aria-checked="false" title="Record the microphone too (M)">
      <svg class="ri" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5.6" y="1.8" width="4.8" height="8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M3.4 7.6a4.6 4.6 0 0 0 9.2 0M8 12.3v2" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
      <span class="rl">Microphone</span>
      <span id="micNote" class="rn"></span>
      <span class="sw" aria-hidden="true"><i></i></span>
    </button>
    <button id="region" class="row" type="button" title="Mantle's own recorder: pick a region or a window" hidden>
      <svg class="ri" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 5V3a1 1 0 0 1 1-1h2M11 2h2a1 1 0 0 1 1 1v2M14 11v2a1 1 0 0 1-1 1h-2M5 14H3a1 1 0 0 1-1-1v-2" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>
      <span class="rl">Record a region or window</span>
      <svg class="chev" viewBox="0 0 8 8" width="8" height="8" aria-hidden="true"><path d="M2.5 1.2 5.3 4 2.5 6.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <footer class="foot">
    <button id="last" class="last" type="button" title="Open the last clip" hidden>
      <span class="thumb"><img id="lastImg" alt="" hidden><i class="play" aria-hidden="true"></i></span>
      <span class="lw"><span id="lastTitle" class="lt"></span><span id="lastWhen" class="lm"></span></span>
    </button>
    <span id="noLast" class="nolast">No clips yet</span>
    <span class="grow"></span>
    <button id="open" class="open" type="button" title="Open Clips (O)">Open Clips<svg viewBox="0 0 8 8" width="8" height="8" aria-hidden="true"><path d="M2.5 1.2 5.3 4 2.5 6.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </footer>
</section>
</div>
<script src="mock-mantle.js"></script>
<script src="../shared/bar-follow.js"></script>
<script src="record.js"></script>
<!-- dark only: the blurred picture of the screen behind this window, once main sends clips.backdrop -->
<script src="../shared/glass-adapt.js"></script>
<script src="../shared/hud-backdrop.js" data-event="clips.backdrop" data-pane="#card"></script>
</body>
</html>
