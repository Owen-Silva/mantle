<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file:; script-src file:; img-src file: data:; font-src file:">
<title>Mantle Screenshot saved</title>
<!-- The ~5 s card after a capture, bottom right above the bar: what was saved and copied (or, in
     plain words, what was not and why), a click opens the file, Copy path / Open folder. -->
<link rel="stylesheet" href="../shared/glass-light.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div id="card" hidden>
  <button type="button" id="open" class="thumb" title="Open the screenshot" aria-label="Open the screenshot">
    <img id="thumb" alt="">
    <svg class="open-glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M13.2 2.8L8 8M6.5 3.5h-3v9h9v-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="text">
    <div id="title" class="title" role="status"></div>
    <div id="name" class="name"></div>
    <div id="status" class="status"></div>
    <div id="warn" class="warn" hidden></div>
    <div class="actions">
      <button type="button" id="copy-path" class="act" title="Copy the file's full path, to paste into a chat or a terminal">Copy path</button>
      <button type="button" id="folder" class="act" title="Show the screenshot in its folder">Open folder</button>
    </div>
  </div>
  <button type="button" id="dismiss" class="x" title="Close" aria-label="Close">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <div id="timer" class="timer"></div>
</div>
<script src="card-mock.js"></script>
<script src="geometry.js"></script>
<script src="card.js"></script>
</body>
</html>
