<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file:; script-src file:; img-src file: data:; font-src file:">
<title>Mantle Screenshot</title>
<!-- One of these per monitor: the frozen frame of THAT monitor, dimmed, with the selection cut out
     of the dim. Main parks it off screen with the next frame already decoded, and moves it on
     screen when the page says ready (lib/features/screenshot.js). -->
<link rel="stylesheet" href="../shared/glass-light.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body class="mode-rect">
<img id="frame" alt="" draggable="false">
<div id="dim"></div>
<div id="hole" hidden></div>
<div id="guide-x" class="guide" hidden></div>
<div id="guide-y" class="guide" hidden></div>
<div id="size" class="pill" hidden aria-live="off"></div>

<div id="bar" role="toolbar" aria-label="Screenshot mode">
  <button type="button" class="mode" data-mode="rect" aria-pressed="true" title="Rectangle (R)">
    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="5.5" width="13" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.4 1.6"/></svg>
    <span>Rectangle</span>
  </button>
  <button type="button" class="mode" data-mode="window" aria-pressed="false" title="Window (W)">
    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 7.5h14" stroke="currentColor" stroke-width="1.4"/></svg>
    <span>Window</span>
  </button>
  <button type="button" class="mode" data-mode="full" aria-pressed="false" title="Full screen (F)">
    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 16.5h5M10 14v2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span>Full screen</span>
  </button>
  <!-- "Copy text" (ocr lane, 2026-09-27): drag like Rectangle; the text in the area goes on the
       clipboard (Windows' own OCR, sidecar/Ocr.cs). Unavailable = aria-disabled with the reason. -->
  <button type="button" class="mode" data-mode="text" aria-pressed="false" title="Copy text (T)">
    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.4 1.6"/><path d="M6.5 7h7M10 7v6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>Copy text</span>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="close" title="Cancel (Esc)" aria-label="Cancel">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
</div>
<div id="hint" class="pill"></div>
<div id="problem" role="alert" hidden><b>Screenshot unavailable</b><span id="problem-text"></span><em>Esc closes this</em></div>

<script src="mock-mantle.js"></script>
<script src="geometry.js"></script>
<script src="overlay.js"></script>
</body>
</html>
