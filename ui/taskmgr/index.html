<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file:; script-src file:; img-src file: data:; font-src file:">
<title>Mantle Task Manager</title>
<!-- glass-light.css ONLY: the taskbar island's --lg-* tokens are the whole palette -->
<link rel="stylesheet" href="../shared/glass-light.css">
<link rel="stylesheet" href="taskmgr.css">
<link rel="stylesheet" href="pages/processes.css">
<link rel="stylesheet" href="pages/performance.css">
<link rel="stylesheet" href="pages/apphistory.css">
<link rel="stylesheet" href="pages/startup.css">
<link rel="stylesheet" href="pages/users.css">
<link rel="stylesheet" href="pages/details.css">
<link rel="stylesheet" href="pages/services.css">
<link rel="stylesheet" href="pages/game.css">
<link rel="stylesheet" href="pages/settings.css">
<link rel="stylesheet" href="../shared/wall-bdrop.css">
</head>
<body>
<!-- Mantle's task manager (lib/features/taskmgr.js) = the stock Windows 11 Task Manager in Mantle's skin
     (the user, 2026-10-28; contract: mantle-wt/TM-SPEC.md). The SHELL (taskmgr.js) draws the title bar, the
     nav rail, each page's title + command bar, the menus and the dialogs; each page is one module in pages/
     (pages/<id>.js + .css) that registers with TM.page(). Everything on screen comes from main's taskmgr.model. -->
<main class="app" id="app">
  <header class="title">
    <img class="appic" src="../../assets/icons/mantle-taskmgr-small.svg" alt="" width="16" height="16">
    <span class="appname">Task Manager</span>
    <div class="tsearch">
      <label class="search" id="search" title="Search (Ctrl+F)">
        <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><circle cx="5" cy="5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M7.7 7.7 10.8 10.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <input id="q" type="text" placeholder="Type a name, publisher, or PID to search" aria-label="Type a name, publisher, or PID to search (Ctrl+F)" spellcheck="false" autocomplete="off">
        <button id="qx" class="qx" type="button" aria-label="Clear search (Esc)" title="Clear search (Esc)" hidden><svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      </label>
    </div>
    <div class="wc">
      <button data-op="min" type="button" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M1 5h8" stroke="currentColor" stroke-width="1.1"/></svg></button>
      <button data-op="max" type="button" aria-label="Maximize" title="Maximize"><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.1" fill="none"/></svg></button>
      <button data-op="close" class="x" type="button" aria-label="Close" title="Close"><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.1"/></svg></button>
    </div>
  </header>

  <div class="body">
    <!-- the nav rail (taskmgr.js fills it from NAV): icons + labels, icons only when narrow -->
    <nav class="rail" id="rail" aria-label="Pages">
      <button type="button" class="ham" id="ham" aria-label="Open navigation" aria-expanded="true" title="Open navigation"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
      <div class="navs" id="navs" role="tablist" aria-orientation="vertical"></div>
      <div class="navfoot" id="navfoot"></div>
    </nav>

    <!-- the content layer: Windows 11's raised card with the rounded top-left corner -->
    <div class="content" id="content">
      <div class="phead">
        <h1 class="ptitle" id="ptitle"></h1>
        <div class="pextra" id="pextra"></div>
        <div class="cmdbar" id="cmdbar" role="toolbar" aria-label="Commands"></div>
      </div>
      <div id="note" class="note" hidden></div>
      <section class="page" id="pg-processes" data-page="processes" hidden></section>
      <section class="page" id="pg-performance" data-page="performance" hidden></section>
      <section class="page" id="pg-apphistory" data-page="apphistory" hidden></section>
      <section class="page" id="pg-startup" data-page="startup" hidden></section>
      <section class="page" id="pg-users" data-page="users" hidden></section>
      <section class="page" id="pg-details" data-page="details" hidden></section>
      <section class="page" id="pg-services" data-page="services" hidden></section>
      <section class="page" id="pg-game" data-page="game" hidden></section>
      <section class="page" id="pg-settings" data-page="settings" hidden></section>
    </div>
  </div>

  <div id="menus" class="menus"></div>
  <div id="dlg" class="dlgwrap" hidden></div>
</main>
<script src="mock-mantle.js"></script>
<!-- dark: the wallpaper under the tint, as Helm does (lane helm-wall-apps) -->
<script src="../shared/wall-bdrop.js" data-event="taskmgr.wall" data-pos="taskmgr.wallpos"></script>
<script src="taskmgr.js"></script>
<script src="pages/processes.js"></script>
<script src="pages/performance.js"></script>
<script src="pages/apphistory.js"></script>
<script src="pages/startup.js"></script>
<script src="pages/users.js"></script>
<script src="pages/details.js"></script>
<script src="pages/services.js"></script>
<script src="pages/game.js"></script>
<script src="pages/settings.js"></script>
</body>
</html>
