<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Scheme sources, not 'self': a file:// document is an opaque origin in
       Chromium, so 'self' matches nothing and would block this page's own CSS.
       data: is in img-src because the wallpaper picture main sends arrives as a
       PNG data URL and is painted as a CSS background-image.
       media-src/img-src file: are the wallpaper itself (a video, gif or picture
       in Mantle's library, played straight off disk), and frame-src mantle-wp:
       is a web wallpaper, which lib/wallpaper.js serves on its own origin. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src file:; script-src file:; img-src file: data:; media-src file:; frame-src http://127.0.0.1:7373 mantle-wp:">
  <title>Mantle desktop</title>
  <!-- tokens.css first, for fonts and geometry only; glass-light.css after it,
       and EVERY colour on this page comes from that file (--lg-*). It is the
       same token set ui/bar resolves through, because the desktop layer wears
       the taskbar's theme, not one of its own. -->
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/glass-light.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<!-- no-backdrop is the state this page BOOTS in: no picture of the wallpaper has
     arrived yet, so the tiles carry themselves on the thicker fallback tint. It
     comes off on the first good 'desktop.backdrop'. -->
<body class="no-backdrop">
  <!--
    The desktop layer sits UNDER every window and OVER the wallpaper, so the body
    stays transparent and only these panes paint. One top-left cluster: the time,
    what the machine is doing, a live look at Mission Control, and - only when
    there is something wrong - a strip that says what and why.

    Every pane is the taskbar's material, in the taskbar's order: .bdrop (the
    wallpaper under THAT pane, blurred) first, the tint on its ::after above it,
    the content above that. The .bdrop divs are empty on purpose - the picture is
    one CSS background, parked on <html> as --desktop-backdrop by desktop.js.

    THE WALLPAPER (2026-09-22) is the bottom of this stack: Mantle plays it here
    now instead of Lively playing it in a window underneath, which the panes
    covered. desktop.js puts ONE element in #wall - a <video>, an <img> or a web
    wallpaper's sandboxed <iframe> - and while it is drawing (body.has-wall) the
    panes frost it with a real backdrop-filter instead of the still picture.
  -->
  <div class="wall" id="wall" aria-hidden="true"></div>

  <main class="cluster">

    <section class="pane time" aria-label="Clock">
      <div class="bdrop" aria-hidden="true"></div>
      <!-- 12-hour with seconds, Windows style: "4:15:32 PM". The parts are
           separate elements so a tick rewrites only the digits that changed. -->
      <div class="clock" id="clock">
        <span class="hm" id="clock-hm">--:--</span><span class="cn">:</span><span class="ss" id="clock-ss">--</span><span class="mer" id="clock-mer"></span>
      </div>
      <div class="date" id="date">&nbsp;</div>
    </section>

    <section class="pane tile" id="stats-tile" aria-label="System">
      <div class="bdrop" aria-hidden="true"></div>
      <h2 class="tile-head">System</h2>
      <dl class="rows">
        <div class="row"><dt>CPU</dt><dd id="cpu">&mdash;</dd></div>
        <div class="row"><dt>Memory</dt><dd id="mem">&mdash;</dd></div>
        <div class="row" id="battery-row" hidden><dt>Battery</dt><dd id="battery">&mdash;</dd></div>
      </dl>
      <p class="note" id="stats-note" hidden></p>
    </section>

    <section class="pane tile" id="mc-tile" aria-label="Mission Control">
      <div class="bdrop" aria-hidden="true"></div>
      <h2 class="tile-head">Mission Control <span class="head-note" id="mc-head-note"></span></h2>
      <div class="mc-frame" id="mc-frame" hidden></div>
      <p class="note" id="mc-note">Checking 127.0.0.1:7373&hellip;</p>
    </section>

    <section class="pane strip" id="strip" hidden aria-label="Needs attention">
      <div class="bdrop" aria-hidden="true"></div>
      <h2 class="tile-head">Needs attention <span class="head-note" id="strip-mode"></span></h2>
      <ul class="strip-list" id="strip-list"></ul>
    </section>

  </main>

  <!-- Plain browser scripts: contextIsolation and sandbox are on, so there is no
       require() here. window.mantle (from preload.js) is the only bridge.
       mock-mantle.js installs a fake one ONLY when there is no real bridge, which
       inside Electron is never - it is here so this page can be opened straight
       off disk (?mock=1) and looked at. -->
  <script src="mock-mantle.js"></script>
  <script src="desktop.js"></script>
</body>
</html>
